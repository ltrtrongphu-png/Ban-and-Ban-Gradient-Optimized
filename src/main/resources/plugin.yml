name: BaB
version: '1.0.0'
main: com.example.bab.BaB
api-version: '1.21'
author: trongphu
description: Ban and Ban - AntiCheat heuristic (hệ thống VL) + AntiSpam, ban qua LiteBans
softdepend: [LiteBans, AdvancedBan, LightBan, ProtocolLib]
# PacketEvents duoc SHADE (dong goi) truc tiep vao jar cua BaB (xem pom.xml), nen
# KHONG can khai bao no o day nhu 1 plugin server rieng - no la 1 thu vien noi bo.
commands:
  bab:
    description: Lệnh quản trị BaB
    usage: /bab <vl|exempt|reset|reload>
permissions:
  bab.admin:
    description: Quyền dùng lệnh /bab
    default: op
  bab.alerts:
    description: Nhắn cảnh báo vi phạm/ban từ BaB
    default: op
  bab.bypass:
    description: Được miễn kiểm tra AntiCheat/AntiSpam (dùng cho Staff test)
    default: false
